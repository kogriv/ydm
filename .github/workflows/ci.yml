name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is 3.9, not the README's historical "3.6+" claim: the
        # sync_* tools use argparse.BooleanOptionalAction (added in 3.9).
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile every .py file (syntax check)
        run: find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 python -m py_compile

      - name: --help smoke test (catches broken argparse config)
        run: |
          python ydm.py --help
          python tools/sync_tree.py --help
          python tools/sync_exclude.py --help
          python tools/sync_filters.py --help
          python tools/sync_bisync.py --help
          python tools/sync_policy.py --help
          python tools/ydm_menu.py --help
          python tools/trash_scan.py --help
          python tools/cloud_delta.py --help
          python tasks/junk/plan_cleanup.py --help
          python tasks/junk/run_cleanup.py --help

      - name: Unit tests (Analyzer/StorageManager on synthetic data)
        run: python tests/test_analyzer.py -v

      - name: Unit tests (sync_backends abstraction)
        run: python tests/test_sync_backends.py -v

      - name: Unit tests (daemon policy bench — synthetic db, temp config.cfg)
        run: python tests/test_sync_policy_daemon.py -v

      - name: Unit tests (sync_tree policy/cloud)
        run: python tests/test_sync_tree.py -v

      - name: Unit tests (ydm_menu)
        run: python tests/test_ydm_menu.py -v

      - name: Unit tests (trash_scan restore/compare, offline fake client)
        run: python tests/test_trash_scan.py -v

      - name: Unit tests (cloud_delta staleness detection, offline fake client)
        run: python tests/test_cloud_delta.py -v

      - name: Unit tests (shell aliases — names, ydm=menu, mirror guard)
        run: python tests/test_aliases.py -v

      # No remote is involved: with the baseline attributed to a mirror, two
      # unrelated trees never reach the stage that would consult rclone.
      - name: Unit tests (rename baseline attribution, no rclone)
        run: python tests/test_sync_rename.py -v

      # The scheduled Android job decides every half hour whether bisync runs,
      # and had no coverage at all. A stub `python3` earlier on PATH answers
      # for the preflight, so this tests the script's reasoning and reaches
      # neither rclone nor the device.
      - name: Unit tests (Android job — what it does with the guard's verdict)
        run: python tests/test_job_run.py -v

      # The synthetic bench: a policy file, folders on disk and a database,
      # driven end to end. It is the only coverage the menu screens have, and
      # until 2026-08-25 it ran nowhere but a developer's machine — which is
      # how a menu offering paths from someone else's setup passed CI. The
      # rclone-backed checks inside skip themselves when rclone is absent, so
      # a runner without it still gets the rest.
      - name: Unit tests (sync/menu bench — synthetic tree, temp policy)
        run: python tests/test_sync_bench.py -v

      - name: Regression suite (tests/test_ydm_fixes.sh)
        run: bash tests/test_ydm_fixes.sh

      # tests/test_scan.sh and tests/test_rclone_backend.sh are NOT run
      # here on purpose: the former scans the real Yandex Disk API
      # (needs YANDEX_DISK_TOKEN), the latter needs a live, authorized
      # `rclone` remote. Neither is safe or meaningful against a
      # throwaway CI runner with no cloud account attached. See
      # CONTRIBUTING.md for how to run them locally.
